<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Services – Staff Portal</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: adminNavbar}"></nav>
<div class="container-fluid px-4 py-4">
    <div class="page-header d-flex align-items-center justify-content-between">
        <div><h1><i class="bi bi-grid me-2 text-primary"></i>Services</h1>
        <p>Define what your business offers — duration and price per service.</p></div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addServiceModal">
            <i class="bi bi-plus-lg me-1"></i>Add Service
        </button>
    </div>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card content-card">
        <div class="card-body p-0">
            <div th:if="${services.empty}" class="text-center text-muted py-5">
                <i class="bi bi-grid fs-2 d-block mb-2"></i>No services yet — add one above.
            </div>
            <table th:if="${!services.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>Name</th><th>Description</th><th>Duration</th><th>Price</th><th class="text-end">Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${services}">
                        <td class="fw-semibold" th:text="${s.name}"></td>
                        <td class="text-muted" th:text="${s.description}"></td>
                        <td th:text="|${s.durationMinutes} min|"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(s.price, 1, 2)}"></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary me-1"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editSvc-' + ${s.id}">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <form th:action="@{/admin/services/{id}/delete(id=${s.id})}" method="post"
                                  class="d-inline" onsubmit="return confirm('Remove this service?')">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit modals -->
<div th:each="s : ${services}">
    <div class="modal fade" th:id="'editSvc-' + ${s.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/services/{id}/edit(id=${s.id})}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-pencil me-1"></i>Edit Service</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Name</label>
                            <input type="text" name="name" class="form-control" th:value="${s.name}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <input type="text" name="description" class="form-control" th:value="${s.description}"/>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-semibold">Duration (min)</label>
                                <input type="number" name="durationMinutes" class="form-control"
                                       min="5" max="480" th:value="${s.durationMinutes}" required/>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-semibold">Price ($)</label>
                                <input type="number" name="price" class="form-control"
                                       min="0" step="0.01" th:value="${s.price}" required/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Add Service Modal -->
<div class="modal fade" id="addServiceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/services}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-1"></i>Add Service</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Haircut" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="Short description"/>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold">Duration (min)</label>
                            <input type="number" name="durationMinutes" class="form-control" min="5" max="480" value="60" required/>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold">Price ($)</label>
                            <input type="number" name="price" class="form-control" min="0" step="0.01" value="0.00" required/>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Service</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
