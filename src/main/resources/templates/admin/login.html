<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Staff Login – BookSmart</title>
    <style>
        body { background: #1a1e2e; }
        .login-card { border: none; border-radius: 18px; box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
        .pin-input { font-size: 2rem; letter-spacing: 0.5rem; text-align: center; border-radius: 12px; }
        .pin-input:focus { box-shadow: 0 0 0 3px rgba(13,110,253,.35); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="text-center" style="width: 100%; max-width: 380px; padding: 1rem;">

    <div class="mb-4 text-white">
        <i class="bi bi-calendar-check" style="font-size: 2.5rem;"></i>
        <h2 class="fw-bold mt-2" th:text="${businessName}">BookSmart</h2>
        <p class="text-secondary">Staff Portal</p>
    </div>

    <div class="card login-card p-4">
        <h5 class="fw-bold mb-1">Enter your PIN</h5>
        <p class="text-muted small mb-4">Contact your administrator if you don't have one.</p>

        <div th:if="${locked}" class="alert alert-danger py-2 small mb-3">
            <i class="bi bi-lock-fill me-1"></i>
            Too many failed attempts. Please restart the session or try again later.
        </div>
        <div th:if="${hasError and !locked}" class="alert alert-danger py-2 small mb-3">
            <i class="bi bi-exclamation-circle me-1"></i>
            Incorrect PIN —
            <span th:text="${remaining == 1} ? '1 attempt remaining.' : ${remaining} + ' attempts remaining.'"></span>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-4">
                <input type="password" name="pin" class="form-control pin-input"
                       placeholder="••••" maxlength="20" autofocus required
                       th:disabled="${locked}"/>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"
                    th:disabled="${locked}">
                <i class="bi bi-unlock me-1"></i>Sign In
            </button>
        </form>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="text-secondary small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Back to booking page
        </a>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
