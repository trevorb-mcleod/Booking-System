<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Dashboard – BookSmart</title>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <!-- Page header -->
    <div class="page-header d-flex align-items-center justify-content-between">
        <div>
            <h1><i class="bi bi-house me-2 text-primary"></i>Dashboard</h1>
            <p>Welcome back — here's what's happening today.</p>
        </div>
        <a th:href="@{/appointments/book}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Booking
        </a>
    </div>

    <!-- Stat cards -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                        <i class="bi bi-calendar-check"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalAppointments}">0</div>
                        <div class="text-muted small">Total Appointments</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="stat-icon bg-success bg-opacity-10 text-success">
                        <i class="bi bi-people"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalClients}">0</div>
                        <div class="text-muted small">Clients</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                        <i class="bi bi-person-badge"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalProviders}">0</div>
                        <div class="text-muted small">Providers</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="stat-icon bg-info bg-opacity-10 text-info">
                        <i class="bi bi-grid"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalServices}">0</div>
                        <div class="text-muted small">Services Offered</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Today's appointments -->
    <div class="card content-card">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span><i class="bi bi-calendar-day me-2 text-primary"></i>
                Today's Appointments
                <span class="badge bg-primary ms-1" th:text="${todayCount}">0</span>
            </span>
            <a th:href="@{/appointments}" class="btn btn-sm btn-outline-secondary">
                View All <i class="bi bi-arrow-right ms-1"></i>
            </a>
        </div>
        <div class="card-body p-0">
            <div th:if="${todayAppointments.empty}" class="text-center text-muted py-5">
                <i class="bi bi-calendar-x fs-2 d-block mb-2"></i>
                No appointments today.
                <div class="mt-2">
                    <a th:href="@{/appointments/book}" class="btn btn-sm btn-primary">Book One Now</a>
                </div>
            </div>
            <table th:if="${!todayAppointments.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Time</th>
                        <th>Client</th>
                        <th>Provider</th>
                        <th>Service</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${todayAppointments}">
                        <td class="fw-semibold" th:text="${#temporals.format(a.startTime, 'h:mm a')}"></td>
                        <td th:text="${a.client.name}"></td>
                        <td th:text="${a.provider.name}"></td>
                        <td th:text="${a.service.name}"></td>
                        <td>
                            <span th:switch="${a.status.toString()}">
                                <span th:case="'CONFIRMED'" class="badge bg-success">Confirmed</span>
                                <span th:case="'PENDING'"   class="badge bg-warning text-dark">Pending</span>
                                <span th:case="'CANCELLED'" class="badge bg-danger">Cancelled</span>
                                <span th:case="*"           class="badge bg-secondary" th:text="${a.status}">Status</span>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
