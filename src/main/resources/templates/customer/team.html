<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Our Team – BookSmart</title>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">

    <div class="page-header text-center mb-5">
        <h1><i class="bi bi-people me-2 text-primary"></i>Meet Our Team</h1>
        <p class="text-muted">Our staff and the services they offer.</p>
    </div>

    <!-- Empty state -->
    <div th:if="${providers.empty}" class="text-center text-muted py-5">
        <i class="bi bi-person-badge fs-2 d-block mb-2"></i>
        No staff members listed yet — check back soon!
    </div>

    <!-- Provider cards -->
    <div class="row g-4" th:if="${!providers.empty}">
        <div class="col-md-6 col-lg-4" th:each="p : ${providers}">
            <div class="card content-card h-100">
                <div class="card-body d-flex flex-column">

                    <!-- Provider header -->
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary flex-shrink-0">
                            <i class="bi bi-person-circle fs-4"></i>
                        </div>
                        <div>
                            <div class="fw-bold fs-5" th:text="${p.name}"></div>
                            <div class="text-muted small">
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#temporals.format(p.workdayStart, 'h:mm a')} + ' – ' + ${#temporals.format(p.workdayEnd, 'h:mm a')}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Services this provider offers -->
                    <div class="mb-3 flex-grow-1">
                        <p class="fw-semibold small text-uppercase text-muted mb-2"
                           style="letter-spacing:.05em;">Services Offered</p>

                        <div th:if="${p.serviceIds.empty}" class="text-muted small fst-italic">
                            No services assigned yet.
                        </div>

                        <ul th:if="${!p.serviceIds.empty}" class="list-unstyled mb-0">
                            <th:block th:each="sid : ${p.serviceIds}">
                                <th:block th:each="s : ${services}" th:if="${s.id == sid}">
                                    <li class="d-flex justify-content-between align-items-center
                                                py-1 border-bottom border-light">
                                        <span>
                                            <i class="bi bi-check2 text-success me-1"></i>
                                            <span th:text="${s.name}"></span>
                                            <span class="text-muted small"
                                                  th:text="' · ' + ${s.durationMinutes} + ' min'"></span>
                                        </span>
                                        <span class="badge bg-success bg-opacity-10 text-success fw-semibold"
                                              th:text="${'$' + #numbers.formatDecimal(s.price, 1, 2)}"></span>
                                    </li>
                                </th:block>
                            </th:block>
                        </ul>
                    </div>

                    <!-- Book CTA -->
                    <a th:href="@{/book(provider=${p.id})}" class="btn btn-primary btn-sm w-100 mt-auto">
                        <i class="bi bi-calendar-plus me-1"></i>Book with <span th:text="${p.name}"></span>
                    </a>

                </div>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
