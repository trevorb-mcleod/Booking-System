<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>BookSmart – Appointment Booking</title>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">

    <!-- Hero -->
    <div class="text-center py-5">
        <h1 class="display-5 fw-bold"><i class="bi bi-calendar-check text-primary me-2"></i><span th:text="${businessName}">BookSmart</span></h1>
        <p class="lead text-muted mb-4" th:text="${tagline}">Appointment Booking Made Easy</p>
        <a th:href="@{/book}" class="btn btn-primary btn-lg px-5">
            <i class="bi bi-calendar-plus me-2"></i>Book an Appointment
        </a>
    </div>

    <!-- Providers -->
    <div th:if="${!providers.empty}" class="mt-4">
        <h2 class="h4 fw-semibold mb-3"><i class="bi bi-person-badge me-2 text-primary"></i>Our Team</h2>
        <div class="row g-3">
            <div class="col-sm-6 col-lg-4" th:each="p : ${providers}">
                <div class="card content-card h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                            <i class="bi bi-person-circle fs-4"></i>
                        </div>
                        <div>
                            <div class="fw-semibold" th:text="${p.name}"></div>
                            <div class="text-muted small"
                                 th:text="${'Hours: ' + #temporals.format(p.workdayStart, 'h:mm a') + ' – ' + #temporals.format(p.workdayEnd, 'h:mm a')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Services -->
    <div th:if="${!services.empty}" class="mt-5">
        <h2 class="h4 fw-semibold mb-3"><i class="bi bi-grid me-2 text-primary"></i>Services</h2>
        <div class="row g-3">
            <div class="col-sm-6 col-lg-4" th:each="s : ${services}">
                <div class="card content-card h-100">
                    <div class="card-body">
                        <div class="fw-semibold mb-1" th:text="${s.name}"></div>
                        <div class="text-muted small mb-2" th:text="${s.description}"></div>
                        <span class="badge bg-primary bg-opacity-10 text-primary me-1"
                              th:text="${s.durationMinutes + ' min'}"></span>
                        <span class="badge bg-success bg-opacity-10 text-success"
                              th:text="${'$' + #numbers.formatDecimal(s.price, 1, 2)}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CTA footer -->
    <div class="text-center mt-5 pt-3">
        <a th:href="@{/book}" class="btn btn-primary px-5">
            <i class="bi bi-calendar-plus me-2"></i>Book Now
        </a>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
