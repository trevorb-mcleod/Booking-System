<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Providers – BookSmart</title>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <!-- Page header -->
    <div class="page-header d-flex align-items-center justify-content-between">
        <div>
            <h1><i class="bi bi-person-badge me-2 text-primary"></i>Providers</h1>
            <p>Manage your staff, their hours, and the services they offer.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProviderModal">
            <i class="bi bi-plus-lg me-1"></i>Add Provider
        </button>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Providers table -->
    <div class="card content-card">
        <div class="card-body p-0">
            <div th:if="${providers.empty}" class="text-center text-muted py-5">
                <i class="bi bi-person-badge fs-2 d-block mb-2"></i>
                No providers yet — add your first one above.
            </div>
            <table th:if="${!providers.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Hours</th>
                        <th>Services</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${providers}">
                        <td>
                            <div class="fw-semibold" th:text="${p.name}"></div>
                            <div class="text-muted small font-monospace" th:text="${p.id}"></div>
                        </td>
                        <td>
                            <div th:text="${p.email}"></div>
                            <div class="text-muted small" th:text="${p.phone}"></div>
                        </td>
                        <td th:text="${#temporals.format(p.workdayStart, 'h:mm a')} + ' – ' + ${#temporals.format(p.workdayEnd, 'h:mm a')}"></td>
                        <td>
                            <span th:if="${p.serviceIds.empty}" class="text-muted small">None assigned</span>
                            <span th:each="sid, iter : ${p.serviceIds}">
                                <span class="badge bg-light text-dark border me-1"
                                      th:text="${services.?[id == #vars.sid][0]?.name ?: sid}"></span>
                            </span>
                        </td>
                        <td class="text-end">
                            <!-- Assign service dropdown -->
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#assignModal-' + ${p.id}">
                                <i class="bi bi-link-45deg"></i> Assign
                            </button>
                            <!-- Delete -->
                            <form th:action="@{/providers/{id}/delete(id=${p.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Remove this provider?')">
                                <button class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Assign Service Modals (one per provider) -->
<div th:each="p : ${providers}">
    <div class="modal fade" th:id="'assignModal-' + ${p.id}" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <form th:action="@{/providers/{id}/assign-service(id=${p.id})}" method="post">
                    <div class="modal-header">
                        <h6 class="modal-title">
                            <i class="bi bi-link-45deg me-1"></i>Assign Service
                            <span class="text-muted fw-normal" th:text="' — ' + ${p.name}"></span>
                        </h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label fw-semibold">Service</label>
                        <select name="serviceId" class="form-select" required>
                            <option value="">— Select service —</option>
                            <option th:each="s : ${services}"
                                    th:value="${s.id}"
                                    th:text="${s.name}"></option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-sm btn-primary">Assign</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Add Provider Modal -->
<div class="modal fade" id="addProviderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/providers}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-plus me-1"></i>Add Provider</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Jamie Lee" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="jamie@business.com"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone</label>
                        <input type="text" name="phone" class="form-control" placeholder="555-0100"/>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold">Work Start</label>
                            <input type="time" name="workStart" class="form-control" value="09:00" required/>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold">Work End</label>
                            <input type="time" name="workEnd" class="form-control" value="17:00" required/>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Add Provider
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
