<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!--/*
  Shared fragments included in every page.
  head     — CSS imports
  navbar   — top navigation bar
  scripts  — JS imports
*/-->
<th:block th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</th:block>
</head>

<body>

<!-- ── Admin Navbar ───────────────────────────────────────────────────────── -->
<nav th:fragment="adminNavbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/admin/}">
            <i class="bi bi-calendar-check"></i><span th:text="${businessName}">BookSmart</span>
            <span class="badge bg-secondary fw-normal" style="font-size:.7rem;">Staff</span>
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a th:classappend="${currentPage == 'dashboard'} ? ' active' : ''"
                       class="nav-link" th:href="@{/admin/}">
                        <i class="bi bi-house me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentPage == 'appointments'} ? ' active' : ''"
                       class="nav-link" th:href="@{/admin/appointments}">
                        <i class="bi bi-calendar3 me-1"></i>Appointments
                    </a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentPage == 'services'} ? ' active' : ''"
                       class="nav-link" th:href="@{/admin/services}">
                        <i class="bi bi-grid me-1"></i>Services
                    </a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentPage == 'providers'} ? ' active' : ''"
                       class="nav-link" th:href="@{/admin/providers}">
                        <i class="bi bi-person-badge me-1"></i>Providers
                    </a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentPage == 'clients'} ? ' active' : ''"
                       class="nav-link" th:href="@{/admin/clients}">
                        <i class="bi bi-people me-1"></i>Clients
                    </a>
                </li>
            </ul>
            <div class="d-flex gap-2 align-items-center">
                <a th:href="@{/admin/appointments/book}" class="btn btn-primary btn-sm px-3">
                    <i class="bi bi-plus-lg me-1"></i>Book
                </a>
                <a th:href="@{/admin/settings}"
                   th:classappend="${currentPage == 'settings'} ? ' active' : ''"
                   class="btn btn-outline-light btn-sm" title="Settings">
                    <i class="bi bi-gear"></i>
                </a>
                <a th:href="@{/admin/logout}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ── Customer Navbar ────────────────────────────────────────────────────── -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
    <div class="container px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-calendar-check text-primary"></i><span th:text="${businessName}">BookSmart</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/team}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-people me-1"></i>Our Team
            </a>
            <a th:href="@{/book}" class="btn btn-primary px-4">
                <i class="bi bi-calendar-plus me-1"></i>Book Appointment
            </a>
        </div>
    </div>
</nav>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
