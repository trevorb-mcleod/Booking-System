<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Appointments – BookSmart</title>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <!-- Page header -->
    <div class="page-header d-flex align-items-center justify-content-between">
        <div>
            <h1><i class="bi bi-calendar3 me-2 text-primary"></i>Appointments</h1>
            <p th:text="${filterLabel}">All Appointments</p>
        </div>
        <a th:href="@{/appointments/book}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Booking
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filters -->
    <div class="card content-card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-auto">
                    <label class="form-label fw-semibold small mb-1">Filter by Date</label>
                    <form th:action="@{/appointments}" method="get" class="d-flex gap-2">
                        <input type="date" name="date" class="form-control form-control-sm"/>
                        <button class="btn btn-sm btn-outline-primary">Go</button>
                    </form>
                </div>
                <div class="col-auto">
                    <label class="form-label fw-semibold small mb-1">Filter by Provider</label>
                    <form th:action="@{/appointments}" method="get" class="d-flex gap-2">
                        <select name="providerId" class="form-select form-select-sm">
                            <option value="">— All Providers —</option>
                            <option th:each="p : ${providers}"
                                    th:value="${p.id}"
                                    th:text="${p.name}"></option>
                        </select>
                        <button class="btn btn-sm btn-outline-primary">Go</button>
                    </form>
                </div>
                <div class="col-auto">
                    <label class="form-label fw-semibold small mb-1">Filter by Client</label>
                    <form th:action="@{/appointments}" method="get" class="d-flex gap-2">
                        <select name="clientId" class="form-select form-select-sm">
                            <option value="">— All Clients —</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:text="${c.name}"></option>
                        </select>
                        <button class="btn btn-sm btn-outline-primary">Go</button>
                    </form>
                </div>
                <div class="col-auto">
                    <a th:href="@{/appointments}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i>Clear
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Appointments table -->
    <div class="card content-card">
        <div class="card-body p-0">
            <div th:if="${appointments.empty}" class="text-center text-muted py-5">
                <i class="bi bi-calendar-x fs-2 d-block mb-2"></i>
                No appointments found.
            </div>
            <table th:if="${!appointments.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date &amp; Time</th>
                        <th>Service</th>
                        <th>Provider</th>
                        <th>Client</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${appointments}">
                        <td>
                            <div class="fw-semibold"
                                 th:text="${#temporals.format(a.startTime, 'MMM d, yyyy')}"></div>
                            <div class="text-muted small"
                                 th:text="${#temporals.format(a.startTime, 'h:mm a')} + ' – ' + ${#temporals.format(a.endTime, 'h:mm a')}"></div>
                        </td>
                        <td th:text="${a.service.name}"></td>
                        <td th:text="${a.provider.name}"></td>
                        <td>
                            <div th:text="${a.client.name}"></div>
                            <div class="text-muted small" th:text="${a.client.phone}"></div>
                        </td>
                        <td>
                            <span th:switch="${a.status.toString()}">
                                <span th:case="'CONFIRMED'" class="badge bg-success">Confirmed</span>
                                <span th:case="'PENDING'"   class="badge bg-warning text-dark">Pending</span>
                                <span th:case="'CANCELLED'" class="badge bg-danger">Cancelled</span>
                                <span th:case="'COMPLETED'" class="badge bg-secondary">Completed</span>
                                <span th:case="*"           class="badge bg-secondary" th:text="${a.status}">Status</span>
                            </span>
                        </td>
                        <td class="text-muted small fst-italic"
                            th:text="${a.notes.isBlank()} ? '—' : ${a.notes}"></td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-1">
                                <!-- Add/Edit Notes -->
                                <button class="btn btn-sm btn-outline-secondary"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#notesModal-' + ${a.id}"
                                        title="Add Notes">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <!-- Complete -->
                                <form th:if="${a.status.toString() == 'CONFIRMED'}"
                                      th:action="@{/appointments/{id}/complete(id=${a.id})}"
                                      method="post" class="d-inline">
                                    <button class="btn btn-sm btn-outline-success" title="Mark Complete">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                </form>
                                <!-- Cancel -->
                                <form th:if="${a.status.toString() != 'CANCELLED' && a.status.toString() != 'COMPLETED'}"
                                      th:action="@{/appointments/{id}/cancel(id=${a.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Cancel this appointment?')">
                                    <button class="btn btn-sm btn-outline-danger" title="Cancel">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Notes Modals (one per appointment) -->
<div th:each="a : ${appointments}">
    <div class="modal fade" th:id="'notesModal-' + ${a.id}" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <form th:action="@{/appointments/{id}/notes(id=${a.id})}" method="post">
                    <div class="modal-header">
                        <h6 class="modal-title"><i class="bi bi-pencil me-1"></i>Notes</h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <textarea name="notes" rows="3" class="form-control"
                                  placeholder="Enter notes…"
                                  th:text="${a.notes}"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-sm btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
