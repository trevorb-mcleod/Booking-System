# Production / hosted demo — activate with SPRING_PROFILES_ACTIVE=prod
# Secrets and URLs come from environment variables only (never commit real values).

server.port=${PORT:8080}
spring.thymeleaf.cache=true

spring.datasource.url=jdbc:sqlite:${BOOKING_DB_PATH:booking.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

booking.business-name=${BOOKING_BUSINESS_NAME:BookSmart}
booking.tagline=${BOOKING_TAGLINE:Appointment Booking Made Easy}
booking.base-url=${BOOKING_BASE_URL}

booking.admin.pin=${BOOKING_ADMIN_PIN}

booking.email.enabled=${BOOKING_EMAIL_ENABLED:false}
booking.reminders.enabled=${BOOKING_REMINDERS_ENABLED:false}
booking.reminders.from=${BOOKING_REMINDERS_FROM:}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

booking.sms.enabled=${BOOKING_SMS_ENABLED:false}
booking.sms.trial-mode=${BOOKING_SMS_TRIAL_MODE:true}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Avoid failing Render health checks when SMTP is not configured (email disabled).
management.health.mail.enabled=${booking.email.enabled}
